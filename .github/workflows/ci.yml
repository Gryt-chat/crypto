name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, matching Release. npm rather than yarn: this repo is npm, and
          # `npm ci` is what the release installs with.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Against `dist`, not `src`, because dist is what a client installs, and
      # the two are not the same file: `add-esm-extensions.mjs` rewrites every
      # relative specifier on the way out. GRYT-344 shipped a `@gryt/voice` that
      # tsc was happy with and Node could not load, every import extensionless,
      # and it got out because the checks ran from `prepublishOnly` — which is
      # after a pull request has merged and a release is halfway done.
      - name: Check the crypto
        run: npm test
