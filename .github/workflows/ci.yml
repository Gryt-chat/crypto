name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, matching Release. npm rather than yarn: this repo is npm, and
          # `npm ci` is what the release installs with.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # Code here is TypeScript so its types get checked (GRYT-1800). A file that has to stay
      # JavaScript goes in .js-allowlist, one path a line, with a # comment saying why.
      - name: No new JavaScript
        run: |
          allowed=$(grep -v '^#' .js-allowlist 2>/dev/null || true)
          found=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' | grep -vxF -e "$allowed" -e '' || true)
          if [ -n "$found" ]; then
            echo "::error::JavaScript not on .js-allowlist. Write it in TypeScript (GRYT-1800):"
            echo "$found"
            exit 1
          fi
      - run: npm run build

      # Against `dist`, not `src`: `add-esm-extensions.mjs` rewrites every specifier on the
      # way out, and GRYT-344 shipped a package tsc liked and Node could not load.
      - name: Check the crypto
        run: npm test
