name: Release

# Dispatched, not automatic. @gryt/ui publishes through changesets on every push
# to main, which suits a package with a changeset per PR; this one has no
# changesets, one maintainer, and a consumer that pins a version deliberately.
# So it works the way Release Client and Release Server already do — you pick it
# when you mean it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version argument: patch, minor, major, or an exact version like 0.1.0'
        required: true
        default: patch
      tag:
        description: 'npm dist-tag'
        required: true
        default: latest
        type: choice
        options: [latest, beta, next]

# Two dispatches at once is how 0.1.0-beta.6 ended up on npm with no commit
# behind it: both runs published, and the slower one then failed to push because
# the faster had already moved main. Releases queue instead of racing, and are
# never cancelled, because cancelling one mid-publish is worse than waiting.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Trusted publishing. There is no NPM_TOKEN in this repo and there should not
  # be one — npm mints a short-lived credential from this token instead.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1 or newer, which is ahead of what the
      # Node 24 image ships.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # GRYT-344 shipped a package tsc was happy with and Node could not load at
      # all — every relative import in dist was extensionless, which only a
      # bundler tolerates. It was caught by someone trying it by hand, so that
      # attempt is a step now. This runs against the real dist, before anything
      # is published.
      # GRYT-344 shipped a package tsc was happy with and Node could not load at
      # all. This loads the real dist and checks the whole surface the client
      # imports, rather than the five names the first version of this step
      # asserted — which passed while four exports were missing.
      - name: Check the built package imports and is complete
        run: npm run check-surface

      # The React Native entry exists so a phone bundle contains no AudioContext
      # and no RNNoise worker. Metro follows `new Worker(new URL(...))` as a
      # dependency, so one convenient import from the wrong file turns into
      # "Unable to resolve module @shiguredo/rnnoise-wasm" in somebody else's
      # app, several releases later. This walks dist and checks.
      - name: Check the React Native entry stays free of web-only code
        run: npm run check-native-entry

      # GRYT-433: two files each declared `NativeAudioCapture`, and the explicit
      # re-export in engine.ts beat the star export silently. The hook's return
      # type could not be named from outside the package at all, and nothing in
      # the build had an opinion about it. This walks the built .d.ts graph and
      # fails on a name declared twice.
      - name: Check no exported name is declared twice
        run: npm run check-type-names

      - name: Set the version
        id: version
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --provenance --access public --tag "${{ inputs.tag }}"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v${{ steps.version.outputs.version }} [skip ci]"

          # Annotated, because --follow-tags ignores lightweight tags. The
          # workflow tagged every release from 0.1.0-beta.1 onwards and pushed
          # none of them, silently, because of that one flag.
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "v${{ steps.version.outputs.version }}"

          # The publish above cannot be undone, so this must not fail on a busy
          # main. Rebase onto whatever landed while the build ran.
          git pull --rebase origin main
          git push origin HEAD:main --follow-tags

      - name: Summary
        run: |
          echo "Published @gryt/crypto@${{ steps.version.outputs.version }} to the ${{ inputs.tag }} tag." >> "$GITHUB_STEP_SUMMARY"
